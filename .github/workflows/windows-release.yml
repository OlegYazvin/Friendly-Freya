name: Windows Release

on:
  push:
    tags:
      - "v*"
  # Review runs and tag pushes validate without publishing. Publish only by
  # manually dispatching this workflow on a version tag after release signoff.
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the selected version tag after HP and player signoff"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_EDITOR_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
  GODOT_TEMPLATES_SHA256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"

jobs:
  build:
    name: Validate and export
    runs-on: ubuntu-latest
    outputs:
      release-label: ${{ steps.release-label.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve artifact label
        id: release-label
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            label="$GITHUB_REF_NAME"
            if [[ ! "$label" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must have the form vMAJOR.MINOR.PATCH: $label" >&2
              exit 1
            fi
            version="${label#v}"
            if ! grep -Fqx "application/file_version=\"${version}.0\"" godot/export_presets.cfg || \
               ! grep -Fqx "application/product_version=\"${version}.0\"" godot/export_presets.cfg; then
              echo "Windows executable version must match release tag $label." >&2
              exit 1
            fi
            if [[ "$(head -n 1 packaging/windows/RELEASE_NOTES.md)" != "# Friendly Freya $label" ]]; then
              echo "Release notes heading must match release tag $label." >&2
              exit 1
            fi
            expected_install_line="$(printf '1. Download \140Friendly-Freya-%s-Windows-x86_64.zip\140.' "$label")"
            if ! grep -Fqx "$expected_install_line" packaging/windows/RELEASE_NOTES.md; then
              echo "Release notes install ZIP must match release tag $label." >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "Publishing requires manually running this workflow on a version tag." >&2
              exit 1
            fi
            label="manual-$GITHUB_RUN_NUMBER"
          else
            echo "Unsupported workflow ref: $GITHUB_REF" >&2
            exit 1
          fi
          case "$label" in
            *[!A-Za-z0-9._-]*|'')
              echo "Unsupported release label: $label" >&2
              exit 1
              ;;
          esac
          echo "value=$label" >> "$GITHUB_OUTPUT"

      - name: Download verified Godot editor
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          editor_zip="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$editor_zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $editor_zip" | sha256sum --check --strict
          unzip -q "$editor_zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Restore Windows export templates
        id: template-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-windows-x86-64-templates-${{ env.GODOT_TEMPLATES_SHA256 }}

      - name: Download verified Windows export templates
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          templates_archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl --fail --location --retry 3 --output "$templates_archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $templates_archive" | sha256sum --check --strict
          mkdir -p "$templates_dir"
          unzip -j -q "$templates_archive" \
            templates/version.txt \
            templates/windows_debug_x86_64.exe \
            templates/windows_debug_x86_64_console.exe \
            templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe \
            -d "$templates_dir"
          (
            cd "$templates_dir"
            sha256sum \
              version.txt \
              windows_debug_x86_64.exe \
              windows_debug_x86_64_console.exe \
              windows_release_x86_64.exe \
              windows_release_x86_64_console.exe \
              > .extracted-files.sha256
            printf '%s\n' "$GODOT_TEMPLATES_SHA256" > .source-archive.sha256
          )

      - name: Verify restored export templates
        shell: bash
        run: |
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test "$(cat "$templates_dir/version.txt")" = "${GODOT_VERSION}.stable"
          test "$(cat "$templates_dir/.source-archive.sha256")" = "$GODOT_TEMPLATES_SHA256"
          (
            cd "$templates_dir"
            sha256sum --check --strict .extracted-files.sha256
          )

      - name: Run startup, intro, and gameplay validation
        shell: bash
        run: |
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            ./scripts/predeploy_size_checks.sh

      - name: Build Windows ZIP
        shell: bash
        env:
          RELEASE_LABEL: ${{ steps.release-label.outputs.value }}
        run: |
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            FREYA_RELEASE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist" \
            ./scripts/build_windows_release.sh "$RELEASE_LABEL"

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: friendly-freya-windows
          path: |
            dist/Friendly-Freya-${{ steps.release-label.outputs.value }}-Windows-x86_64.zip
            dist/Friendly-Freya-${{ steps.release-label.outputs.value }}-Windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Start exported game on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: friendly-freya-windows
          path: dist

      - name: Validate archive and start game
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows ZIP was not downloaded.' }
          $checksum = Get-ChildItem -Path dist -Filter '*.zip.sha256' | Select-Object -First 1
          if ($null -eq $checksum) { throw 'Windows checksum was not downloaded.' }
          $expectedHash = ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Windows ZIP SHA-256 verification failed.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath smoke
          $exe = Get-Item 'smoke/FriendlyFreya/FriendlyFreya.exe'
          $pck = Get-Item 'smoke/FriendlyFreya/FriendlyFreya.pck'
          if ($exe.Length -le 0 -or $pck.Length -le 0) { throw 'Exported EXE or PCK is empty.' }

          Push-Location $exe.Directory.FullName
          try {
            $env:FREYA_STARTUP_VALIDATE = '1'
            $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--headless', '--log-file', 'startup-smoke.log') -Wait -PassThru
            $exitCode = $process.ExitCode
            if (Test-Path startup-smoke.log) { Get-Content startup-smoke.log }
            if ($exitCode -ne 0) { throw "FriendlyFreya.exe exited with code $exitCode." }
            if (-not (Select-String -Path startup-smoke.log -Pattern 'STARTUP_OK' -Quiet)) {
              throw 'Windows startup log did not contain STARTUP_OK.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Verify packaged performance runner and exported stress entry
        shell: pwsh
        run: |
          $runner = Get-Item 'smoke/FriendlyFreya/RunPerformanceQA.ps1'
          $cmd = Get-Item 'smoke/FriendlyFreya/RunPerformanceQA.cmd'
          if ($runner.Length -le 0 -or $cmd.Length -le 0) { throw 'Packaged performance runner is empty.' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($runner.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Performance runner PowerShell parse errors: $parseErrors" }

          $exe = Get-Item 'smoke/FriendlyFreya/FriendlyFreya.exe'
          Push-Location $exe.Directory.FullName
          try {
            $env:FREYA_EXPORTED_PERF_STRESS = '1'
            $env:FREYA_WORLD_SEED = '20260831'
            $env:FREYA_PERF_STRESS_WARMUP_SECONDS = '0'
            $env:FREYA_PERF_STRESS_SAMPLE_SECONDS = '6'
            $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--headless', '--log-file', 'performance-entry-smoke.log') -Wait -PassThru
            if (Test-Path performance-entry-smoke.log) { Get-Content performance-entry-smoke.log -Tail 60 }
            if ($process.ExitCode -ne 0) { throw "Exported performance route exited with code $($process.ExitCode)." }
            if (-not (Select-String -Path performance-entry-smoke.log -Pattern 'PERF_STRESS_RESULT' -Quiet)) {
              throw 'Exported performance route did not report PERF_STRESS_RESULT.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Verify exported Watch Intro opening route
        shell: pwsh
        run: |
          $exe = Get-Item 'smoke/FriendlyFreya/FriendlyFreya.exe'
          $logPath = Join-Path $exe.Directory.FullName 'watch-intro-smoke.log'
          Push-Location $exe.Directory.FullName
          try {
            $env:FREYA_EXPORTED_WATCH_INTRO_QA = '1'
            $env:FREYA_WORLD_SEED = '20260831'
            $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--headless', '--resolution', '960x540', '--log-file', 'watch-intro-smoke.log') -Wait -PassThru
            if (Test-Path -LiteralPath $logPath) { Get-Content -LiteralPath $logPath -Tail 80 }
            if ($process.ExitCode -ne 0) { throw "Exported Watch Intro route exited with code $($process.ExitCode)." }
            if (-not (Test-Path -LiteralPath $logPath)) { throw 'Exported Watch Intro log is missing.' }
            foreach ($marker in @('WATCH_INTRO_UFO_HOLD_OK', 'WATCH_INTRO_FAMILY_HOLD_OK', 'WATCH_INTRO_MEAL_OK', 'WATCH_INTRO_FIRST_EXIT_OK', 'WATCH_INTRO_ROUTE_OK')) {
              if (-not (Select-String -Path $logPath -Pattern $marker -SimpleMatch -Quiet)) {
                throw "Exported Watch Intro log did not contain $marker."
              }
            }
          }
          finally {
            Pop-Location
          }

  windows-campaign-qa:
    name: Exported Windows start-to-credits route
    needs:
      - build
      - windows-smoke
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: friendly-freya-windows
          path: dist

      - name: Run exported package through credits and Keep Exploring
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
          $checksum = Get-ChildItem -Path dist -Filter '*.zip.sha256' | Select-Object -First 1
          if ($null -eq $archive -or $null -eq $checksum) { throw 'Windows package or checksum is missing.' }
          $expectedHash = ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Windows ZIP SHA-256 verification failed.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath smoke
          $exe = Get-Item 'smoke/FriendlyFreya/FriendlyFreya.exe'
          $pck = Get-Item 'smoke/FriendlyFreya/FriendlyFreya.pck'
          if ($exe.Length -le 0 -or $pck.Length -le 0) { throw 'Exported EXE or PCK is empty.' }

          $logPath = Join-Path $exe.Directory.FullName 'windows-campaign.log'
          Push-Location $exe.Directory.FullName
          try {
            $env:FREYA_EXPORTED_CAMPAIGN_QA = '1'
            $env:FREYA_NATURAL_CAMPAIGN = '1'
            $env:FREYA_WORLD_SEED = '20260831'
            $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--headless', '--resolution', '960x540', '--log-file', 'windows-campaign.log') -Wait -PassThru
            if (Test-Path -LiteralPath $logPath) { Get-Content -LiteralPath $logPath -Tail 200 }
            if ($process.ExitCode -ne 0) { throw "FriendlyFreya.exe campaign route exited with code $($process.ExitCode)." }
            if (-not (Test-Path -LiteralPath $logPath)) { throw 'Windows campaign log is missing.' }
            foreach ($marker in @('NATURAL_ROUTE_CREDITS_OK', 'NATURAL_ROUTE_KEEP_EXPLORING_OK', 'NATURAL_ROUTE_CAMPAIGN_OK')) {
              if (-not (Select-String -Path $logPath -Pattern $marker -SimpleMatch -Quiet)) {
                throw "Windows campaign log did not contain $marker."
              }
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows campaign log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: friendly-freya-windows-campaign-log
          path: smoke/FriendlyFreya/windows-campaign.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish_release == true
    needs:
      - build
      - windows-smoke
      - windows-campaign-qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_LABEL: ${{ needs.build.outputs.release-label }}
    steps:
      - name: Confirm manual version-tag publication
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$RELEASE_LABEL" != "$GITHUB_REF_NAME" ]]; then
            echo "A public release requires manual dispatch on its matching version tag." >&2
            exit 1
          fi

      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: friendly-freya-windows
          path: dist

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/Friendly-Freya-${GITHUB_REF_NAME}-Windows-x86_64.zip"
          checksum="$archive.sha256"
          (
            cd dist
            sha256sum --check --strict "$(basename "$checksum")"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Friendly Freya $GITHUB_REF_NAME" \
              --notes-file packaging/windows/RELEASE_NOTES.md
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --verify-tag \
              --title "Friendly Freya $GITHUB_REF_NAME" \
              --notes-file packaging/windows/RELEASE_NOTES.md
          fi
